version: '3.8'

services:
  devbox:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # User & Permissions
        USERNAME: ${DEV_USERNAME:-devbox}
        USER_UID: ${DEV_UID:-501}
        USER_GID: ${DEV_GID:-501}

        # Runtime Selection Flags (true/false) & Versions
        INSTALL_GO: ${INSTALL_GO:-true}
        GO_VERSION: ${GO_VERSION:-1.24.5}
        GOPRIVATE: ${GOPRIVATE:-}

        INSTALL_NODE: ${INSTALL_NODE:-true}
        NODE_VERSION: ${NODE_VERSION:-22}

        INSTALL_PYTHON: ${INSTALL_PYTHON:-true}

        INSTALL_BUN: ${INSTALL_BUN:-false}

        INSTALL_RUST: ${INSTALL_RUST:-false}

        INSTALL_DB_CLI: ${INSTALL_DB_CLI:-true}

        INSTALL_NATS: ${INSTALL_NATS:-true}

        INSTALL_GH: ${INSTALL_GH:-true}

        INSTALL_GLAB: ${INSTALL_GLAB:-true}
        GLAB_VERSION: ${GLAB_VERSION:-1.118.0}

    image: devbox:latest
    container_name: devbox
    hostname: devbox
    restart: unless-stopped

    # Required for OpenVPN TUN/TAP interface & routing
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1

    # Port mappings
    ports:
      # SSH Server (Connect using: ssh devbox or ssh -p 2222 devbox@localhost)
      - "${SSH_PORT:-2222}:22"

      # --- Engage Services ---
      # Frontend Web (Vite dev server)
      - "5173:5173"
      # Microservices backend ports
      - "3100:3100"   # auth-service
      - "3150:3150"   # api-backend
      - "3300:3300"   # cronjob-service (Engage) / backend-service (CRM)
      - "3530:3530"   # ai-flow
      - "3720:3720"   # api-ingestion-service
      - "3740:3740"   # api-processing-service

      # --- CRM Services ---
      - "3005:3005"   # CRM frontend
      - "3400:3400"   # CRM user-service
      - "3600:3600"   # CRM webhook-service
      - "3800:3800"   # CRM leadbot-backend
      - "3900:3900"   # CRM workflow-automation-service
      - "4002:4002"   # CRM integration-service
      - "4003:4003"   # CRM webhook-sender

    environment:
      - DEV_USERNAME=${DEV_USERNAME:-devbox}
      - GIT_USER_NAME=${GIT_USER_NAME:-${GIT_NAME:-}}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-${GIT_EMAIL:-}}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GH_TOKEN=${GH_TOKEN:-${GITHUB_TOKEN:-}}
      - GITLAB_TOKEN=${GITLAB_TOKEN:-}
      - GLAB_TOKEN=${GLAB_TOKEN:-${GITLAB_TOKEN:-}}
      - GITLAB_HOST=${GITLAB_HOST:-gitlab.com}
      - GIT_ORG=${GIT_ORG:-}
      - GOPRIVATE=${GOPRIVATE:-}
      - GOPROXY=${GOPROXY:-https://proxy.golang.org,direct}
      - GOTOOLCHAIN=${GOTOOLCHAIN:-auto}
      - AUTO_CONNECT_VPN=${AUTO_CONNECT_VPN:-false}

    volumes:
      # Mount workspace directly from container directory
      - ./workspace:/workspace
      # Mount OpenVPN config directory
      - ./vpn:/workspace/vpn
      # Automatically authorize host Mac SSH key for passwordless SSH login
      - ${SSH_PUBKEY_PATH:-~/.ssh/id_ed25519.pub}:/tmp/authorized_keys:ro
      # Mount generated plugins plan and materialized files (read-only)
      - ./.generated/plugins:/opt/devbox/plugins:ro
      # Named cache for Go modules (keeps builds fast between rebuilds)
      - go-cache:/home/${DEV_USERNAME:-devbox}/go/pkg/mod

    stdin_open: true
    tty: true

volumes:
  go-cache:
    name: ${GO_CACHE_NAME:-devbox-go-cache}
