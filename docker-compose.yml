version: '3.8'

services:
  devbox:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # User & Permissions
        USERNAME: ${DEV_USERNAME:-devbox}
        USER_UID: ${DEV_UID:-501}
        USER_GID: ${DEV_GID:-501}

        # Passed through to plugin build hooks that consume it. Runtime/CLI
        # selection and versions are configured via the devbox plugin system
        # (see devbox.plugins.yml), not build args.
        GOPRIVATE: ${GOPRIVATE:-}

    image: devbox:latest
    container_name: devbox
    hostname: devbox
    restart: unless-stopped

    # Required for OpenVPN TUN/TAP interface & routing
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1

    # Port mappings
    ports:
      # SSH Server (Connect using: ssh devbox or ssh -p 2222 devbox@localhost)
      - "${SSH_PORT:-2222}:22"

      # Add additional port mappings here for services running inside the
      # container (e.g. "3000:3000" for a dev server).

    environment:
      - DEV_USERNAME=${DEV_USERNAME:-devbox}
      - GIT_USER_NAME=${GIT_USER_NAME:-${GIT_NAME:-}}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-${GIT_EMAIL:-}}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GH_TOKEN=${GH_TOKEN:-${GITHUB_TOKEN:-}}
      - GITLAB_TOKEN=${GITLAB_TOKEN:-}
      - GLAB_TOKEN=${GLAB_TOKEN:-${GITLAB_TOKEN:-}}
      - GITLAB_HOST=${GITLAB_HOST:-gitlab.com}
      - GIT_ORG=${GIT_ORG:-}
      - GOPRIVATE=${GOPRIVATE:-}
      - GOPROXY=${GOPROXY:-https://proxy.golang.org,direct}
      - GOTOOLCHAIN=${GOTOOLCHAIN:-auto}
      - AUTO_CONNECT_VPN=${AUTO_CONNECT_VPN:-false}

    volumes:
      # Mount workspace directly from container directory
      - ./workspace:/workspace
      # Mount OpenVPN config directory
      - ./vpn:/workspace/vpn
      # Automatically authorize host Mac SSH key for passwordless SSH login
      - ${SSH_PUBKEY_PATH:-~/.ssh/id_ed25519.pub}:/tmp/authorized_keys:ro
      # Mount generated plugins plan and materialized files (read-only)
      - ./.generated/plugins:/opt/devbox/plugins:ro
      # Named cache for Go modules (keeps builds fast between rebuilds)
      - go-cache:/home/${DEV_USERNAME:-devbox}/go/pkg/mod

    stdin_open: true
    tty: true

volumes:
  go-cache:
    name: ${GO_CACHE_NAME:-devbox-go-cache}
